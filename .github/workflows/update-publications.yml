name: Update publications

on:
  schedule:
    - cron: '0 6 * * 6'   # Saturdays 06:00 UTC (~01:00/02:00 Toronto)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # the scan stops itself after 2 failed queries in a row
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      # Source is OpenAlex (the arXiv API rate-limits GitHub runners).
      # OPENALEX_API_KEY is optional: unset, the anonymous daily budget applies.
      - name: Scan OpenAlex for new papers
        id: scan
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -u scripts/fetch_new_papers.py   # -u: retry lines show live

      # Runs even when the scan step exits 1 (some OpenAlex query failed after
      # retries), so papers found by the other queries are still committed.
      # Skipped when the scan never ran (checkout or setup failed).
      - name: Commit and push if changed
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        run: |
          git config user.name "publications-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update publications (weekly OpenAlex scan)"
            git push
          fi
