name: Update publications

on:
  schedule:
    - cron: '0 6 * * 6'   # Saturdays 06:00 UTC (~01:00/02:00 Toronto)
  workflow_dispatch: {}

# one run at a time, so two runs cannot post the same candidates or race on push
concurrency:
  group: update-publications
  cancel-in-progress: false

permissions:
  contents: write
  issues: write      # candidate papers for the project pages are reported as an issue

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # the scan stops itself after 2 failed queries in a row
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      # Source is OpenAlex (the arXiv API rate-limits GitHub runners).
      # OPENALEX_API_KEY is optional: unset, the anonymous daily budget applies.
      - name: Scan OpenAlex for new papers
        id: scan
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -u scripts/fetch_new_papers.py   # -u: retry lines show live

      # Project pages (venus/glimpsed/grapes/gnz7q): rebuild the paper lists
      # from data/projects.yaml and report new candidates as an issue. Runs
      # after the scan even if the scan failed, so it sees this week's papers.
      - name: Rebuild project-page paper lists
        id: projects
        timeout-minutes: 20   # leaves time for the commit step within the job limit
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u scripts/build_project_papers.py

      # Runs even when a step above exits 1 (some OpenAlex query failed after
      # retries), so whatever the other queries found is still committed.
      # Skipped when the scan never ran (checkout or setup failed).
      - name: Commit and push if changed
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        run: |
          git config user.name "publications-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data pages   # the scripts write only under data/ and pages/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update publications and project paper lists (weekly OpenAlex scan)"
            # the monthly curated update or a manual edit may have landed meanwhile
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            git push
          fi
