# Group members used by the weekly publication auto-update
# (.github/workflows/update-publications.yml → scripts/fetch_new_papers.py).
#
# ORCID iDs verified against the ORCID registry (affiliation + listed works)
# on 2026-07-06. The scan queries OpenAlex by ORCID and by name. `since`
# bounds member-led papers: only papers published on/after this date are
# auto-added.
# Removing a member stops future auto-adds (already-added entries stay until
# the curated ADS library replaces or removes them).
#
# name_variants: extra name forms to search for (the main name is always used).
#
# 2026-08-29: removed Minami Nakane, Kanako Narita, and Lilian Lee (not
# directly supervised). Their papers are no longer auto-added by the weekly
# member-led query, and the website no longer flags them as group-led.
# 2026-08-29: PI arxiv_query switched from the weak 'au:"Fujimoto_S"' form
# (75 matches, stale since 2026-06) to the full-name form (239 matches).
# 2026-10-10: the scan moved from the arXiv API to OpenAlex (the arXiv API
# rate-limits GitHub runners). arxiv_query is no longer used and was removed.

# arXiv IDs never to auto-add: namesakes who are not group members, and
# preprints already listed under a journal record that carries no arXiv id.
# Name queries can match a namesake; one with an ORCID or outside astronomy is
# rejected automatically, and this list catches the rest.
exclude_arxiv_ids:
  - "2607.06777"   # Gavin Farley, University of Utah (TDE radio); not our Gavin Farley
  - "2601.10573"   # Asada+ LRD envelopes: listed as ApJL 1005, L22, whose record carries no arXiv id

pi:
  name: Seiji Fujimoto
  orcid: 0000-0001-7201-5066

members:
  - name: Qinyue Fei
    orcid: 0000-0001-7232-5355
    role: postdoc
    since: 2025-07-01
    name_variants: ["Qinyue Fei"]

  - name: Yoshihisa Asada
    orcid: 0000-0003-3983-5438
    role: postdoc
    since: 2025-09-01
    name_variants: ["Yoshihisa Asada"]

  - name: Jacqueline Antwi-Danso
    orcid: 0000-0002-0243-6575
    role: postdoc
    since: 2023-09-01
    name_variants: ["Jacqueline Antwi-Danso"]

  - name: Ava Polzin
    orcid: 0000-0002-5283-933X   # ORCID record + dissertation copyright page, checked 2026-10-02
    role: postdoc
    since: 2026-09-01            # ORCID employment start (Dunlap Postdoctoral Fellow)
    name_variants: ["Ava Polzin"]

  - name: Gavin Farley
    orcid: 0009-0007-2578-9238
    role: undergrad
    since: 2025-09-01
    student_until: 2030-04-30
    name_variants: ["Gavin Farley"]

  - name: Ariel Broderick
    orcid: 0009-0006-0440-2228
    role: grad_student
    since: 2025-09-01
    student_until: 2030-04-30
    name_variants: ["Ariel Broderick"]
